# CI gates for eshu-extension-host. Refs eshu-hq/eshu#8877, part of
# eshu-hq/eshu#6707 (template eshu-hq/eshu#6710: CI rejects Eshu internal
# and cross-collector implementation imports — enforced by the
# TestImportBoundaryRejectsClaimPlaneImports test in the test/race lanes).
#
# Stable job names (org contract; only ci-complete is ever required in a
# ruleset): changes, lint, test, race, image, govulncheck, gosec,
# ci-complete. Lane bodies are inline in this file (see
# eshu-collector-oci-registry .github/workflows/ci.yml for the rationale
# against the reusable workflow until it grows path-gating inputs).
#
# Pinned actions (SHAs synced 2026-10-28 with the uses: lines below;
# re-verify with git ls-remote when auditing; Dependabot
# github-actions proposes bumps, weekly grouped):
#   actions/checkout v7.0.1              3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/setup-go v7.0.0              b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
#   dorny/paths-filter v4                ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
#   golangci/golangci-lint-action v9.3.0 ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
#   actions/upload-artifact v7.0.2       cf430e030ddbb5b0abf93d22962f4752f3646cd9
#   github/codeql-action/upload-sarif v4.39.1 9b3254085494b55a0f7c4c2b3d2d52cc712ce370
# Go tools (hash-verified by the toolchain on install):
#   golangci-lint v2.12.2 (same binary Eshu uses; config in .golangci.yml)
#   govulncheck v1.9.0, run with -scan package (Go 1.26 SSA-safe)
#   gosec v2.30.0, run with -no-fail; the SARIF finding count is advisory
#   until its false-positive rate here is measured, then blocking
#
# Coverage floor: 90.0, the first measured baseline for the dark binary
# (CONTRIBUTING.md: starts at the measured baseline, may only rise toward
# the 90% target — already met).

name: ci

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * 1" # weekly Monday 03:00 UTC: full lane sweep (govulncheck + gosec file findings issues; lint/test/race/image also execute)
  workflow_dispatch: # manual runs execute every lane, like a push

permissions:
  contents: read

# Cancel superseded runs per PR (or per ref for pushes and schedules).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COVERAGE_FLOOR: "90.0"

jobs:
  changes:
    # Runs on every event on purpose: on push the filter outputs are unused
    # (lane conditions short-circuit on event), but every lane `needs` this
    # job — skipping it on push drags all lanes to skipped and the push run
    # goes vacantly green.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      fixtures: ${{ steps.filter.outputs.fixtures }}
      shell: ${{ steps.filter.outputs.shell }}
      deps: ${{ steps.filter.outputs.deps }}
      image: ${{ steps.filter.outputs.image }}
      workflows: ${{ steps.filter.outputs.workflows }}
      misc: ${{ steps.filter.outputs.misc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          # Needed so the `misc` catch-all below can use `!` negations;
          # groups without negations behave exactly as before.
          predicate-quantifier: 'some-with-excludes'
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
            fixtures:
              - 'testdata/**'
              - '**/*.json'
            shell:
              - '**/*.sh'
            deps:
              - 'go.mod'
              - 'go.sum'
            image:
              - 'Dockerfile'
              - '.dockerignore'
            workflows:
              - '.github/workflows/**'
            misc:
              # Default required by the epic: anything not classified above
              # runs the full Go lanes. Docs-only must keep skipping, so the
              # docs skip set stays negated here; every classified pattern is
              # negated too so narrow lanes (fixtures/shell/image) keep their
              # shape. No seed script is checked in for this matrix: verify
              # a change to it with a docs-only PR run (all lanes skip) and
              # a fixture-only PR run (only the test lane fires).
              - '**'
              - '!**/*.md'
              - '!LICENSE'
              - '!CODEOWNERS'
              - '!**/*.go'
              - '!go.mod'
              - '!go.sum'
              - '!.golangci.yml'
              - '!testdata/**'
              - '!**/*.json'
              - '!**/*.sh'
              - '!Dockerfile'
              - '!.dockerignore'
              - '!.github/workflows/**'

  lint:
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: lint (whole repo, no baseline)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --timeout 10m
      - name: format check (gofumpt)
        run: golangci-lint fmt --diff ./...
      - name: tidy check
        run: |
          go mod tidy -diff
          git diff --exit-code -- go.mod go.sum
      - name: zero non-stdlib module deps
        run: |
          # PROVENANCE.md stakes stdlib-only: this proves no second module
          # is required at all, so no claim-plane-capable dependency can
          # enter under a path the import-boundary test does not list.
          [ "$(go list -m all)" = "github.com/eshu-hq/eshu-extension-host" ]
      - name: 500-line file cap (wc -l, sole static gate)
        run: |
          over=0
          for f in $(git ls-files '*.go'); do
            n=$(wc -l < "$f")
            if [ "$n" -gt 500 ]; then echo "$f: $n lines"; over=1; fi
          done
          if [ "$over" -ne 0 ]; then echo "FAIL: .go files over 500 lines"; exit 1; fi
      - name: Diff check
        run: git diff --check
      - name: actionlint
        run: |
          set -euo pipefail
          v="1.7.12"
          # Checksum from actionlint_1.7.12_checksums.txt on the release
          # page; re-verify there when bumping the version.
          sha="8aca8db96f1b94770f1b0d72b6ddcb1ebb8123cb3712530b08cc387b349a3d8"
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${v}/actionlint_${v}_linux_amd64.tar.gz" -o /tmp/actionlint.tar.gz
          echo "${sha}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint

  test:
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.fixtures == 'true' || needs.changes.outputs.shell == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build
        run: go build ./...
      - name: test
        run: go test ./... -count=1

  race:
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: race + coverprofile
        run: go test ./... -race -count=1 -covermode=atomic -coverprofile=coverage.out
      - name: coverage totals
        run: go tool cover -func=coverage.out >> "$GITHUB_STEP_SUMMARY"
      - name: enforce floor (may only rise; target is 90%)
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          echo "statement coverage total=${total}% floor=${COVERAGE_FLOOR}%"
          awk -v t="$total" -v f="$COVERAGE_FLOOR" 'BEGIN { if (t + 0 < f + 0) { print "FAIL: coverage below floor"; exit 1 } }'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          retention-days: 14
          if-no-files-found: error

  image:
    needs: [changes]
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.image == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image without pushing it
        # VERSION is a fixed stamp, never dev: the probe below asserts the
        # Dockerfile ldflags wiring carries it to /healthz, which is the
        # proof the release tag reaches the health payload.
        run: docker build --build-arg VERSION=ci-stamp-proof -t eshu-extension-host:ci .
      - name: Dockerfile bases stay digest-pinned
        run: |
          set -euo pipefail
          from_total=$(grep -Ec '^[[:space:]]*FROM ' Dockerfile)
          from_pinned=$(grep -Ec '^[[:space:]]*FROM [^[:space:]]+@sha256:[0-9a-f]{64}' Dockerfile)
          echo "Dockerfile bases: $from_pinned/$from_total digest-pinned"
          [ "$from_pinned" -eq "$from_total" ]
      - name: Dark posture probe (health only, zero claim flow)
        run: |
          set -euo pipefail
          docker run -d --rm --name extension-host-ci -p 18082:8082 eshu-extension-host:ci
          ok=0
          for _ in $(seq 1 30); do
            body="$(curl -sf http://127.0.0.1:18082/healthz || true)"
            if printf '%s' "$body" | grep -q '"mode":"dark"' && printf '%s' "$body" | grep -q '"version":"ci-stamp-proof"'; then ok=1; break; fi
            sleep 1
          done
          [ "$ok" -eq 1 ]
          curl -sf http://127.0.0.1:18082/metrics | grep -q 'extension_host_claims_enabled 0'
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18082/claims)" = "404" ]
          docker stop extension-host-ci >/dev/null
      - name: Claim enablement refuses startup
        run: |
          set -euo pipefail
          if docker run --rm eshu-extension-host:ci --claims-enabled=true; then
            echo "FAIL: claim enablement started the dark binary"; exit 1
          fi

  govulncheck:
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write # scheduled runs file or update a findings issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck (package mode is Go 1.26 SSA-safe)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" -scan package ./...
      - name: file or update findings issue (scheduled runs)
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="[govulncheck] findings $(date -u +%F)"
          body="Scheduled govulncheck failed on ${{ github.sha }}. See run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          open=$(gh issue list --search "$title in:title" --state open --json number --jq '.[0].number')
          if [ -n "$open" ] && [ "$open" != "null" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  gosec:
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # SARIF upload to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gosec SARIF
        # -no-fail: gosec's bundled type-checker cannot fully load Go 1.26
        # generics and exits non-zero even with zero findings; the finding
        # count below is the gate. Advisory until the false-positive rate
        # here is measured; triage happens in the open, never
        # blanket-excluded. This repo: two G107 suppressions with reason on
        # the test-local loopback probes (main_test.go:115,195); the finding
        # count below must be 0.
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          "$(go env GOPATH)/bin/gosec" -no-fail -fmt=sarif -out=gosec.sarif ./...
      - name: upload SARIF
        # Non-PR events only: fork PRs cannot write code-scanning results,
        # and continue-on-error would turn a 403 into a silent green no-op.
        # The scan step above needs contents:read alone, so PR lanes still
        # run for forks on a read-only token.
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: gosec.sarif
        continue-on-error: true
      - name: finding count (advisory on PR; red on scheduled findings)
        run: |
          n=$(jq '[.runs[].results[]] | length' gosec.sarif)
          echo "## gosec findings: $n" >> "$GITHUB_STEP_SUMMARY"
          echo "gosec findings: $n"
          # Findings fail scheduled runs so the `failure()`-gated issue
          # step below is reachable; PR runs stay advisory green.
          if [ "${n:-0}" -gt 0 ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "gosec findings on a scheduled run; failing to file the issue."
            exit 1
          fi
      - name: file or update findings issue (scheduled runs)
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="[gosec] findings $(date -u +%F)"
          body="Scheduled gosec failed on ${{ github.sha }}. See run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          open=$(gh issue list --search "$title in:title" --state open --json number --jq '.[0].number')
          if [ -n "$open" ] && [ "$open" != "null" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  ci-complete:
    needs: [changes, lint, test, race, image, govulncheck, gosec]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: aggregate (pass when needed lanes passed or legitimately skipped)
        run: |
          python3 - <<'EOF'
          import json, os
          # NEEDS_JSON is toJSON(needs): {job: {"result": ..., "outputs": ...}}.
          # Compare v["result"]: comparing whole job OBJECTS never matches
          # (false-green), and needs.*.result is a bare ARRAY that kills
          # green runs. No seed script is checked in for this shape: verify
          # a change to it with a PR run where one lane skips (ci-complete
          # stays green) and one where a lane fails (ci-complete goes red).
          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = {k: v.get("result") for k, v in needs.items()
                 if isinstance(v, dict) and v.get("result") in ("failure", "cancelled")}
          if bad:
              print("FAIL:", bad)
              raise SystemExit(1)
          print("ci-complete: pass (skips allowed)")
          EOF
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
