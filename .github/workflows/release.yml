# eshu-extension-host release (Refs eshu-hq/eshu#8877, part of
# eshu-hq/eshu#6707).
#
# Tags `v[0-9]*` publish `ghcr.io/eshu-hq/eshu-extension-host` images with
# SLSA provenance, an SPDX SBOM, SBOM attestation, and a Trivy vulnerability
# gate, then cut a GitHub Release carrying the SBOM. PRs never push: the
# `image` lane in ci.yml proves the Dockerfile still builds and serves dark,
# and this workflow only pushes on tag events. A manual dispatch builds the
# staged multi-arch tarball without scanning or pushing to prove the
# workflow itself works.
#
# Gate order is the safety contract: `build-and-scan` runs one leg per push
# platform, each building a staged tarball and failing on any HIGH/CRITICAL
# CVE, `push` runs only after every leg's gate passes and publishes the
# multi-arch image with attestations, and `github-release` cuts the
# Release. A failed scan leaves nothing pullable in GHCR because no tag is
# ever pushed before the scan passes.
#
# The Dockerfile VERSION arg stamps the tag into the binary with
# `-ldflags "-X main.version=..."`, so the health payload reports the
# release instead of `dev`. The stamp path is exercised by the `image` lane
# in ci.yml, which builds with a known VERSION and asserts /healthz
# reports it; the unit test only covers the `--version` flag plumbing.
#
# Pinned actions (re-verify with git ls-remote when auditing; Dependabot
# github-actions proposes bumps, weekly grouped):
#   actions/checkout v7.0.1              3d3c42e5aac5ba805825da76410c181273ba90b1
#   docker/setup-buildx-action v3        8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
#   docker/login-action v3               c94ce9fb468520275223c153574b00df6fe4bcc9
#   docker/metadata-action v5            c299e40c65443455700f0fdfc63efafe5b349051
#   docker/build-push-action v6          10e90e3645eae34f1e60eeb005ba3a3d33f178e8
#   actions/attest-build-provenance v2   96b4a1ef7235a096b17240c259729fdd70c83d45
#   actions/attest v4                    1e69f48acb82d1966a394da916b4c1698aa569d6
#   anchore/sbom-action v0               e22c389904149dbc22b58101806040fa8d37a610
#   aquasecurity/trivy-action 0.36.0     a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
#   softprops/action-gh-release v2       3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
#   actions/download-artifact v4.3.0     d3f86a106a0bac45b974a628896c90dbdf5c8093

name: release

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_PLATFORMS: linux/amd64,linux/arm64

jobs:
  build-and-scan:
    # One leg per push platform: Trivy scans archive images (docker-save
    # layout), which are single-platform by construction, so a single
    # multi-arch tarball cannot gate the push. Each leg builds the staged
    # tarball for its own platform from the same Dockerfile and context
    # the push step publishes, and the push runs only when every leg's
    # scan passes.
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Validate version stamp
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: |
          # The Dockerfile interpolates VERSION into a shell-form RUN for
          # ldflags, so refuse anything but tag/sha characters before the
          # build can interpret them.
          if ! printf '%s' "$VERSION" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "refusing unsafe VERSION stamp: $VERSION" >&2
            exit 1
          fi
      - name: Build staged tarball for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ matrix.platform }}
          outputs: type=docker,dest=/tmp/extension-host-scan-${{ matrix.suffix }}.tar
      - name: Scan staged image for HIGH/CRITICAL CVEs
        if: github.ref_type == 'tag'
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # 0.36.0
        with:
          input: /tmp/extension-host-scan-${{ matrix.suffix }}.tar
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Upload Trivy SARIF on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-results-${{ matrix.suffix }}.sarif
          path: trivy-results.sarif
          retention-days: 14
          if-no-files-found: error

  push:
    needs: [build-and-scan]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=long
      - name: Validate version stamp
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # The Dockerfile interpolates VERSION into a shell-form RUN for
          # ldflags, so refuse anything but tag/sha characters before the
          # build can interpret them.
          if ! printf '%s' "$VERSION" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "refusing unsafe VERSION stamp: $VERSION" >&2
            exit 1
          fi
      - name: Compute source date epoch
        id: epoch
        run: echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
      - name: Pin deterministic labels
        id: labels
        run: |
          CREATED="$(date -u -d "@${{ steps.epoch.outputs.epoch }}" '+%Y-%m-%dT%H:%M:%SZ')"
          printf '%s\n' '${{ steps.meta.outputs.labels }}' > /tmp/labels.txt
          sed -i "s|org\\.opencontainers\\.image\\.created=.*|org.opencontainers.image.created=${CREATED}|" /tmp/labels.txt
          { echo 'labels<<EOF'; cat /tmp/labels.txt; echo 'EOF'; } >> "${GITHUB_OUTPUT}"
      - name: Build and push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.labels.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ env.IMAGE_PLATFORMS }}
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Prepare SBOM output
        run: mkdir -p dist
      - name: Generate image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: dist/eshu-extension-host-image.spdx.json
          artifact-name: eshu-extension-host-image-spdx.json
          upload-artifact: true
          upload-release-assets: false
      - name: Generate SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: dist/eshu-extension-host-image.spdx.json
          push-to-registry: true
      - name: Verify image attestations
        env:
          GH_TOKEN: ${{ github.token }}
          OCI_IMAGE_REF: oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          gh attestation verify "${OCI_IMAGE_REF}" -R "${GITHUB_REPOSITORY}"
          gh attestation verify "${OCI_IMAGE_REF}" -R "${GITHUB_REPOSITORY}" \
            --predicate-type https://spdx.dev/Document/v2.3

  github-release:
    needs: [push]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: read
    steps:
      - name: Download SBOM artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: eshu-extension-host-image-spdx.json
          path: dist
      - name: Cut GitHub Release with SBOM
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/eshu-extension-host-image.spdx.json
          generate_release_notes: true
          body: |
            Image: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.push.outputs.digest }}`
            Provenance and SBOM attestations are attached to the image in GHCR.
            Scan: Trivy HIGH/CRITICAL gate passed on a staged image covering every pushed platform before push.
